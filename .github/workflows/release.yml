# Publishes a release when a v* tag is pushed (#124): builds macOS (arm64,
# amd64) and Linux (amd64, arm64) binaries with GoReleaser (.goreleaser.yaml),
# creates the GitHub release, and writes Formula/agent-loop.rb to
# mayusuk/homebrew-tap.
#
# Needs the repository secret HOMEBREW_TAP_GITHUB_TOKEN: a fine-grained token
# with Contents read and write on mayusuk/homebrew-tap only.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    # macOS, so the darwin builds can use cgo (Keychain backend); Linux is pure Go.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests
        run: go test -race -count=1 ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

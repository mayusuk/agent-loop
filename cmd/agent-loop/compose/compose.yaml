# Temporal and Postgres for agent-loop (TECHNICAL-SPEC T2), written by
# `agent-loop server init`. Temporal listens on 127.0.0.1:7233 only; Postgres
# is reachable only on the Compose network. The password is in .env.
name: agent-loop

services:
  postgresql:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run agent-loop server init to write .env}
    volumes:
      - temporal-postgres:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    depends_on:
      - postgresql
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?run agent-loop server init to write .env}
      POSTGRES_SEEDS: postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/agent-loop.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:7233:7233"

volumes:
  temporal-postgres:
